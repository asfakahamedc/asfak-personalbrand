  <circle cx="16" cy="16" r="2.5" fill="#C49234" fill-opacity="0.9"/>
  <!-- Crosshair ticks -->
  <line x1="16" y1="0"  x2="16" y2="4"  stroke="#C49234" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="16" y2="32" stroke="#C49234" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="0"  y1="16" x2="4"  y2="16" stroke="#C49234" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="32" y2="16" stroke="#C49234" stroke-width="1.2" stroke-linecap="round"/>
</svg>
