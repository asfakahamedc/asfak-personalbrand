<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#0C0B09"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13" stroke="#C49234" stroke-width="1.5" fill="none"/>
  <!-- Inner dashed ring -->
  <circle cx="16" cy="16" r="8" stroke="#C49234" stroke-width="1" fill="none" stroke-dasharray="2 3"/>
